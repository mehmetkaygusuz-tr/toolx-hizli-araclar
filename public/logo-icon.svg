<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#05080F" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Outer subtle stroke gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)" />
      <stop offset="50%" stop-color="rgba(0, 140, 255, 0.1)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)" />
    </linearGradient>

    <!-- Arm 1 Gradient: Top-Left to Bottom-Right with Cyan to Deep Blue -->
    <linearGradient id="arm1Grad" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="25%" stop-color="#0099FF" />
      <stop offset="65%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#0029B8" />
    </linearGradient>

    <!-- Arm 2 Gradient: Top-Right to Bottom-Left with Electric Azure to Navy -->
    <linearGradient id="arm2Grad" x1="80%" y1="15%" x2="25%" y2="85%">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="45%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#002FA8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with smooth rounded corner -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Inner ambient background glow -->
  <circle cx="256" cy="256" r="160" fill="#0055FF" opacity="0.12" filter="url(#softGlow)" />

  <!-- Bold Minimalist 'X' Symbol matching the brand mark -->
  <g transform="translate(256, 256)">
    <!-- Back stroke (Top-Right to Bottom-Left) -->
    <path d="M 68 -174 L 174 -174 L -68 174 L -174 174 Z" fill="url(#arm2Grad)" />
    
    <!-- Front stroke (Top-Left to Bottom-Right) with rich cyan-to-sapphire gradient -->
    <path d="M -174 -174 L -68 -174 L 174 174 L 68 174 Z" fill="url(#arm1Grad)" />
  </g>
</svg>
